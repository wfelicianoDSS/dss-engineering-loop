schema_version: "1.1"
name: collect-duplicate
description: >
  Sentry collect with --yes where WEB-4411 is already open on the board as #301 (same
  fingerprint err|sentry|4411). super-collect must treat it as a duplicate: add a "Seen again"
  comment on #301 with the new evidence and file no new issue. Offline: stubbed gh and
  fixture-backed Sentry.
tags: [super-collect, collect-duplicate]
runs: 3
expected_outcome: A "Seen again" comment on #301 and no new issue.
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Agent]
context:
  scaffold_script: seed.sh
